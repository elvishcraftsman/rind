[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rind"
version = "0.8.0"
description = "A mouse-friendly terminal file manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=8.0", "tomli; python_version < '3.11'"]

[project.optional-dependencies]
images = ["pillow"]

[project.scripts]
rind = "rind.cli:main"

[tool.setuptools]
packages = ["rind"]
